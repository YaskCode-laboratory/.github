name: Defecto
description: Reportar un comportamiento que debe corregirse.
title: "[Defecto] "
body:
  - type: markdown
    attributes:
      value: |
        No publiques secretos, credenciales, información privada ni datos personales en este Issue.
  - type: textarea
    id: problem
    attributes:
      label: Descripción del problema
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Comportamiento observado
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Versión, sistema o configuración no sensible.
  - type: textarea
    id: impact
    attributes:
      label: Impacto
  - type: textarea
    id: resolution
    attributes:
      label: Criterios para considerar corregido
    validations:
      required: true
