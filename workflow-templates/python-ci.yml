name: YaskCode · Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/requirements*.txt'
      - name: Instalar dependencias declaradas
        if: ${{ hashFiles('**/requirements*.txt') != '' }}
        run: |
          requirements=$(find . -name 'requirements*.txt' -print -quit)
          python -m pip install --upgrade pip
          python -m pip install -r "$requirements"
      - name: Validación básica
        run: python -m compileall .
      - name: Ejecutar pruebas con pytest cuando exista configuración o tests
        if: ${{ hashFiles('**/pytest.ini', '**/pyproject.toml', '**/test_*.py', '**/*_test.py') != '' }}
        run: |
          python -m pip install pytest
          python -m pytest
