name: YaskCode · Python CI

on:
  push:
    branches: [ $default-branch ]
  pull_request:
    branches: [ $default-branch ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar dependencias declaradas
        if: ${{ hashFiles('**/requirements*.txt') != '' }}
        run: |
          requirements=$(find . -name 'requirements*.txt' -print -quit)
          python -m pip install --upgrade pip
          python -m pip install -r "$requirements"
      - name: Validación básica
        run: python -m compileall .
      - name: Ejecutar pruebas con pytest cuando existan tests
        if: ${{ hashFiles('**/pytest.ini', '**/test_*.py', '**/*_test.py', 'tests/**/*.py') != '' }}
        run: |
          python -m pip install pytest
          python -m pytest
