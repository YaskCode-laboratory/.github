name: YaskCode · Node CI

on:
  push:
    branches: [ $default-branch ]
  pull_request:
    branches: [ $default-branch ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Restaurar caché de npm
        if: ${{ hashFiles('**/package-lock.json') != '' }}
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - name: Instalar dependencias reproducibles
        if: ${{ hashFiles('**/package-lock.json') != '' }}
        run: npm ci
      - name: Instalar dependencias sin lockfile
        if: ${{ hashFiles('**/package.json') != '' && hashFiles('**/package-lock.json') == '' }}
        run: npm install
      - name: Ejecutar test si está definido
        if: ${{ hashFiles('**/package.json') != '' }}
        run: npm run test --if-present
      - name: Ejecutar lint si está definido
        if: ${{ hashFiles('**/package.json') != '' }}
        run: npm run lint --if-present
      - name: Ejecutar build si está definido
        if: ${{ hashFiles('**/package.json') != '' }}
        run: npm run build --if-present
