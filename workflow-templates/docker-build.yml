name: YaskCode · Docker Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Confirmar Dockerfile
        run: test -f Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Verificar construcción de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: yaskcode-local:ci
